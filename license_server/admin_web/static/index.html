<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furniture Bill &middot; License Admin</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

  <!-- ===== Login view ===== -->
  <section id="login-view" class="view">
    <form class="login-card" id="login-form">
      <h1>Furniture Bill</h1>
      <p class="sub">License Server Admin</p>
      <label>Username<input type="text" id="login-username" autocomplete="username" required></label>
      <label>Password<input type="password" id="login-password" autocomplete="current-password" required></label>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn primary block">Sign In</button>
    </form>
  </section>

  <!-- ===== Dashboard view ===== -->
  <section id="dashboard-view" class="view hidden">
    <header class="topbar">
      <h1>Furniture Bill &middot; License Admin</h1>
      <button class="btn ghost" id="logout-btn">Sign out</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="licenses">Licenses</button>
      <button class="tab" data-tab="customers">Customers</button>
    </nav>

    <!-- Licenses -->
    <div class="panel" id="panel-licenses">
      <div class="toolbar">
        <input type="search" id="license-search" placeholder="Search key or customer...">
        <button class="btn primary" id="new-license-btn">+ New License</button>
      </div>
      <table class="table">
        <thead>
          <tr><th>Key</th><th>Product</th><th>Customer</th><th>Status</th><th>Device</th><th>Activated</th><th>Actions</th></tr>
        </thead>
        <tbody id="license-rows"><tr><td colspan="7" class="muted">Loading...</td></tr></tbody>
      </table>
    </div>

    <!-- Customers -->
    <div class="panel hidden" id="panel-customers">
      <div class="toolbar">
        <input type="search" id="customer-search" placeholder="Search name, mobile or email...">
        <button class="btn primary" id="new-customer-btn">+ New Customer</button>
      </div>
      <table class="table">
        <thead>
          <tr><th>Name</th><th>Mobile</th><th>Email</th><th>Licenses</th><th>Created</th></tr>
        </thead>
        <tbody id="customer-rows"><tr><td colspan="5" class="muted">Loading...</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<div id="modal-overlay" class="hidden">
  <div class="modal" id="modal-box"></div>
</div>

<div id="toast-wrap"></div>
<script src="/app.js"></script>
</body>
</html>
